[package]
name = "kiku"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kiku — Molterra's open-source speech recognition module. An encoder-decoder Transformer ASR following the Whisper architecture (log-Mel frontend, multitask token format), implemented from scratch in Rust and able to load open Whisper checkpoints."

# Excluded from the repo-root workspace (own lockfile, own target dir), the
# same arrangement as capture/ — the empty table pins this crate as its own
# workspace root so cargo never walks up to the repo root.
[workspace]

[dependencies]
anyhow = "1"
candle-core = "0.9"
candle-nn = "0.9"
hound = "3.5"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
