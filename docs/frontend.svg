<text x="731.0" y="131.0" font-size="17" text-anchor="middle" fill="#333">pad or trim</text>
<text x="731.0" y="153.0" font-size="17" text-anchor="middle" fill="#333">to 30 s chunks</text>
<line x1="616" y1="136.0" x2="644" y2="136.0" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="848" y="90" width="170" height="92" rx="12" fill="#e6dcf2" stroke="#6a4e93" stroke-width="1.5"/>
<text x="933.0" y="131.0" font-size="17" text-anchor="middle" fill="#333">Hann STFT</text>
<text x="933.0" y="153.0" font-size="17" text-anchor="middle" fill="#333">FFT 400 · hop 160</text>
<line x1="818" y1="136.0" x2="846" y2="136.0" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="1050" y="90" width="170" height="92" rx="12" fill="#e6dcf2" stroke="#6a4e93" stroke-width="1.5"/>
<text x="1135.0" y="131.0" font-size="17" text-anchor="middle" fill="#333">80 mel</text>
<text x="1135.0" y="153.0" font-size="17" text-anchor="middle" fill="#333">filterbank</text>
<line x1="1020" y1="136.0" x2="1048" y2="136.0" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="1252" y="90" width="170" height="92" rx="12" fill="#e6dcf2" stroke="#6a4e93" stroke-width="1.5"/>
<text x="1337.0" y="131.0" font-size="17" text-anchor="middle" fill="#333">log compress</text>
<text x="1337.0" y="153.0" font-size="17" text-anchor="middle" fill="#333">and normalize</text>
<line x1="1222" y1="136.0" x2="1250" y2="136.0" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="740" y="48" font-size="19" text-anchor="middle" fill="#333">audio frontend · waveform to the 80 × 3000 log Mel spectrogram</text>
<text x="740" y="240" font-size="16" text-anchor="middle" fill="#666">25 ms analysis window, 10 ms hop, 16 kHz mono, 30 second windows</text>
<text x="740" y="268" font-size="16" text-anchor="middle" fill="#666">the same frontend serves training (notebooks) and the Rust runtime, so there is no train versus serve skew</text>
