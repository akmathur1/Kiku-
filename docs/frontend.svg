<text x="529.0" y="131.0" font-size="17" text-anchor="middle" fill="#333">resample</text>
<text x="529.0" y="153.0" font-size="17" text-anchor="middle" fill="#333">to 16 kHz</text>
<line x1="414" y1="136.0" x2="442" y2="136.0" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
