<text x="327.0" y="153.0" font-size="17" text-anchor="middle" fill="#333">to mono</text>
<line x1="212" y1="136.0" x2="240" y2="136.0" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
