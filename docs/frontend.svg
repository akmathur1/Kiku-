<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="340" viewBox="0 0 1480 340" font-family="Georgia, 'Times New Roman', serif">
<rect width="1480" height="340" fill="#fafafa"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
